[project]
name = "embedding-service"
version = "1.0.0"
description = "GraphGPT Embedding Service — Standalone microservice for generating text embeddings using sentence-transformers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.3.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "prometheus-client>=0.19.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "black>=24.1.1",
    "flake8>=7.0.0",
    "isort>=5.13.2",
    "httpx>=0.26.0",
]

# Application, not a library: uv installs dependencies only.
[tool.uv]
package = false

# CPU-only inference (see README): resolve torch from the PyTorch CPU index so
# Linux/Docker builds do not pull the multi-GB CUDA wheels.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88
