[tool.poetry]
name = "embedding-service"
version = "1.0.0"
description = "GraphGPT Embedding Service — Standalone microservice for generating text embeddings using sentence-transformers"
authors = ["Antigravity AI"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
sentence-transformers = "^3.0.0"
torch = "^2.3.0"
grpcio = "^1.60.0"
grpcio-tools = "^1.60.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
prometheus-client = "^0.19.0"
numpy = "^1.26.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
black = "^24.1.1"
flake8 = "^7.0.0"
isort = "^5.13.2"
httpx = "^0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
